name: Deploy Docusaurus Github pages
on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up pnpm
        run: corepack enable pnpm

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install and Build
        env:
          BASE_URL: /DNote/
        run: |
          pnpm install
          pnpm run build

      - name: Copy old_jekyll content
        run: |
          cp -r ${{ github.workspace }}/build ${{ runner.temp }}

          git fetch origin gh-pages
          git reset --hard HEAD
          git checkout gh-pages

          if [ -d "${{ github.workspace }}/old_jekyll" ]; then
              cp -r ${{ github.workspace }}/old_jekyll ${{ runner.temp }}/build/
          else
              echo "old_jekyll directory does not exist, skipping copy."
          fi

          git checkout main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
